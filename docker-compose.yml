version: '3.8'

services:
  # ─── PostgreSQL Database ───────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: movie_admin_db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: pgadmin4
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d pgadmin4"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Adminer UI ────────────────────────────────────────────────
  adminer:
    image: adminer
    container_name: adminer_ui
    ports:
      - "8888:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DEFAULT_SYSTEM: pgsql
    networks:
      - app_network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

networks:
  app_network:
    driver: bridge

volumes:
  pgdata:
